[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "agentcrawl-ai"
version = "0.1.1"
description = "Self-hosted web scraping and Markdown extraction for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AgentCrawl contributors" }]
keywords = [
  "ai-agents",
  "crawler",
  "markdown",
  "mcp",
  "scraping",
  "self-hosted",
  "web-extraction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "html2text>=2025.4.15,<2026.0.0",
]

[project.urls]
Homepage = "https://github.com/JorG18/agentcrawl"
Repository = "https://github.com/JorG18/agentcrawl"
Issues = "https://github.com/JorG18/agentcrawl/issues"
Documentation = "https://github.com/JorG18/agentcrawl#readme"

[project.optional-dependencies]
browser = ["playwright>=1.60.0,<2.0.0"]
docs = ["PyMuPDF>=1.26.0,<2.0.0"]
llm = [
  "langchain>=1.3.2,<2.0.0",
  "pydantic>=2.13.4,<3.0.0",
]
quality = [
  "semchunk>=4.0.0,<5.0.0",
  "simpleeval>=1.0.7,<2.0.0",
]
openai = [
  "langchain>=1.3.2,<2.0.0",
  "langchain-openai>=1.2.2,<2.0.0",
  "pydantic>=2.13.4,<3.0.0",
]
anthropic = [
  "langchain>=1.3.2,<2.0.0",
  "langchain-anthropic>=1.4.4,<2.0.0",
  "pydantic>=2.13.4,<3.0.0",
]
tracking = ["burr>=0.40.2"]
rag = ["qdrant-client>=1.18.0,<2.0.0"]
server = [
  "fastapi>=0.125.0,<1.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "uvicorn[standard]>=0.38.0,<1.0.0",
]
mcp = [
  "mcp>=1.27.1,<2.0.0",
  "pydantic>=2.13.4,<3.0.0",
]
dev = ["httpx>=0.28.0,<1.0.0", "pytest>=8.0.0", "ruff>=0.13.0"]

[project.scripts]
agentcrawl = "agentcrawl.cli:main"
agentcrawl-mcp = "agentcrawl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["agentcrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
