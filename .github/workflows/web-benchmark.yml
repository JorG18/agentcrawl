name: Web benchmark

# Scrape a random sample of real websites (Tranco ranks, homepages and inner
# pages from Common Crawl) with AgentCrawl and other tools, and compare what
# each returned without hand-written expectations (benchmarks/web).
#
# Pull requests that touch it run a small sample with the local tools only.
# Hosted APIs (Firecrawl, ScrapeGraphAI, Tavily) run only on demand, with
# keys from repository secrets; they spend the owner's credits.
on:
  pull_request:
    paths:
      - "benchmarks/web/**"
      - ".github/workflows/web-benchmark.yml"
  workflow_dispatch:
    inputs:
      size:
        description: Pages in the sample
        default: "30"
      hard:
        description: Pages of the size drawn from the hard block (product, news, forum, government, PDF)
        default: "0"
      seed:
        description: Sample seed (same seed, same sample)
        default: "2026"
      tools:
        description: Comma-separated tools
        default: "agentcrawl,crawl4ai,scrapling,firecrawl,scrapegraph,tavily"
      sample_from_run:
        description: Reuse the sample of an earlier run (its run id) instead of drawing one
        default: ""
      keep_html:
        description: Store the HTML AgentCrawl read for every page ("1" = yes)
        default: ""
      stealth:
        description: Install AgentCrawl's stealth extra (Patchright retry) ("1" = yes)
        default: ""
      scrapegraph_pages:
        description: Pages sent to ScrapeGraphAI (about 2 credits each); 0 = all
        default: "50"

permissions:
  contents: read
  actions: read  # to reuse an earlier run's sample

env:
  SIZE: ${{ inputs.size || '20' }}
  SEED: ${{ inputs.seed || '2026' }}
  HARD: ${{ inputs.hard || '5' }}
  TOOLS: ${{ inputs.tools || 'agentcrawl,crawl4ai' }}
  SCRAPEGRAPH_PAGES: ${{ inputs.scrapegraph_pages || '50' }}
  SAMPLE_FROM_RUN: ${{ inputs.sample_from_run || '' }}
  KEEP_HTML: ${{ inputs.keep_html || '' }}

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      local: ${{ steps.tools.outputs.local }}
      hosted: ${{ steps.tools.outputs.hosted }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reuse an earlier sample
        if: env.SAMPLE_FROM_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: web-sample
          run-id: ${{ env.SAMPLE_FROM_RUN }}
          github-token: ${{ github.token }}
      - name: Draw the sample
        if: env.SAMPLE_FROM_RUN == ''
        run: python -m benchmarks.web.sample --size "$SIZE" --hard "$HARD" --seed "$SEED" --out sample.json
      - id: tools
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          tools = [t for t in os.environ["TOOLS"].split(",") if t]
          local = {"agentcrawl", "agentcrawl-camofox", "crawl4ai", "scrapling"}
          print("local=" + " ".join(t for t in tools if t in local))
          print("hosted=" + json.dumps([t for t in tools if t not in local]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web-sample
          path: sample.json

  # The tools that run on the runner share one job, at the same time: from
  # separate jobs each got its own runner IP, and anti-bot verdicts follow
  # the IP, so a page could be let through for one tool and refused for the
  # other on the same day.
  run-local:
    needs: sample
    if: needs.sample.outputs.local != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: web-sample
      - name: Install
        env:
          LOCAL: ${{ needs.sample.outputs.local }}
        run: |
          # One virtualenv per tool: their Playwright pins differ.
          for tool in $LOCAL; do
            python -m venv ".venv-$tool"
            pip=".venv-$tool/bin/python -m pip"
            $pip install --upgrade pip
            case "$tool" in
              crawl4ai) $pip install -e . crawl4ai ;;
              scrapling) $pip install -e . "scrapling[fetchers,ai]"; ".venv-$tool/bin/scrapling" install ;;
              agentcrawl)
                $pip install -e ".[browser]"
                if [ -n "${{ inputs.stealth }}" ]; then
                  $pip install -e ".[stealth]"
                  ".venv-$tool/bin/python" -m patchright install --with-deps chromium
                fi ;;
              agentcrawl-camofox)
                # The Camofox server downloads its Firefox build (~1.3 GB) on
                # first run; it stays up for the scrape step.
                $pip install -e .
                CAMOFOX_BIND_HOST=127.0.0.1 nohup npx -y @askjo/camofox-browser > camofox.log 2>&1 &
                for i in $(seq 1 120); do
                  curl -sf -m 2 http://127.0.0.1:9377/health && break
                  sleep 5
                done
                curl -sf -m 2 http://127.0.0.1:9377/health || { tail -50 camofox.log; exit 1; } ;;
            esac
            if [ "$tool" = "agentcrawl" ] || [ "$tool" = "crawl4ai" ]; then
              ".venv-$tool/bin/python" -m playwright install --with-deps chromium
            fi
          done
      - name: Scrape the sample
        env:
          LOCAL: ${{ needs.sample.outputs.local }}
        run: |
          keep=""
          if [ "$KEEP_HTML" = "1" ]; then keep="--keep-html"; fi
          set -- $LOCAL
          # The runner's 8 page slots split between the tools running at once.
          concurrency=$(( 8 / $# )); [ "$concurrency" -ge 1 ] || concurrency=1
          pids=""
          for tool in $LOCAL; do
            ".venv-$tool/bin/python" -m benchmarks.web.run --tool "$tool" --sample sample.json \
              --concurrency "$concurrency" $keep --out "$tool.jsonl.gz" &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          exit $status
      # Always: a slow or cancelled run still leaves the pages it finished.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-local
          retention-days: 14
          path: |
            *.jsonl.gz
            camofox.log

  run:
    needs: sample
    if: needs.sample.outputs.hosted != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.sample.outputs.hosted) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: web-sample
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Scrape the sample
        env:
          # Only the step that needs a key sees it; the runner never prints it.
          FIRECRAWL_API_KEY: ${{ matrix.tool == 'firecrawl' && secrets.FIRECRAWL_API_KEY || '' }}
          SCRAPEGRAPH_API_KEY: ${{ matrix.tool == 'scrapegraph' && secrets.SCRAPEGRAPH_API_KEY || '' }}
          TAVILY_API_KEY: ${{ matrix.tool == 'tavily' && secrets.TAVILY_API_KEY || '' }}
        run: |
          limit=0
          if [ "${{ matrix.tool }}" = "scrapegraph" ]; then limit="$SCRAPEGRAPH_PAGES"; fi
          # Stay under free-plan rate limits.
          python -m benchmarks.web.run --tool "${{ matrix.tool }}" --sample sample.json \
            --limit "$limit" --concurrency 3 --out "${{ matrix.tool }}.jsonl.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.tool }}
          retention-days: 14
          path: ${{ matrix.tool }}.jsonl.gz

  report:
    needs: [run-local, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: web-*
          merge-multiple: true
      # Tools not rerun (paid APIs) keep their results from the run the sample
      # came from: same pages, earlier day. The summary says so.
      - name: Earlier results for tools not rerun
        if: env.SAMPLE_FROM_RUN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: web-*
          path: earlier
          merge-multiple: true
          run-id: ${{ env.SAMPLE_FROM_RUN }}
          github-token: ${{ github.token }}
      - name: Compare
        run: |
          set -o pipefail
          for file in earlier/*.jsonl.gz; do
            [ -e "$file" ] || continue
            tool=$(basename "$file" .jsonl.gz)
            case ",$TOOLS," in *",$tool,"*) continue ;; esac
            cp "$file" .
            echo "- \`$tool\`: earlier results from run $SAMPLE_FROM_RUN (not rerun)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          python -m benchmarks.web.report --sample sample.json *.jsonl.gz --out web-report \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: web-report.*
