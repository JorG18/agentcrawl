name: Release

# Push a tag like v0.3.0 (matching pyproject.toml) to build the package,
# publish it to PyPI and create the GitHub Release from CHANGELOG.md.
# The Docker image for the tag is published by docker.yml.
#
# Or run it by hand from main with a tag name: the release is built from the
# selected commit and the tag is created there. A tag made by the workflow
# does not start docker.yml, so run that one by hand on the new tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.3.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]*)?$ ]] || {
            echo "::error::not a release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "$TAG" || {
            echo "::error::tag $TAG does not match pyproject version ${version}"; exit 1; }
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,mcp,dev]" build twine
          python -m ruff check agentcrawl tests examples benchmarks
          python -m pytest -q
      - name: Build
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/release_notes.py "$TAG" > dist-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-notes.md

  pypi:
    needs: build
    # Off until the repository variable PUBLISH_PYPI is "true", so a release is
    # not red while PyPI publishing is being set up; GitHub Release and Docker
    # do not depend on it.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the agentcrawl-ai project on pypi.org must list
    # this repository, workflow release.yml and environment "pypi".
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # On a tag push the tag exists; on a manual run gh creates it at SHA.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$TAG" --notes-file dist-notes.md
