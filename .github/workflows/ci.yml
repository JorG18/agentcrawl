name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,mcp,dev]"
      - name: Ruff
        run: python -m ruff check agentcrawl tests examples benchmarks
      - name: Format
        run: python -m ruff format --check agentcrawl tests examples benchmarks
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q agentcrawl benchmarks

  browser:
    # Shadow DOM, iframes, scroll and saved sessions in a real Chromium
    # (tests/test_browser_rendering.py skips itself without one).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the browser extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[browser,server,dev]"
          python -m playwright install --with-deps chromium
      - name: Real-browser tests
        run: python -m pytest -q tests/test_browser_rendering.py tests/test_sessions.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t agentcrawl-community:ci .

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the TypeScript client
        working-directory: sdk/typescript
        run: npm test
