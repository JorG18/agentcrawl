# TEMPORARY (removed before merge): extraction tuning on captured pages.
name: Tune extraction (temporary)
on:
  pull_request:
    paths:
      - "agentcrawl/parsing.py"
      - "scripts/tmp_tune.py"
      - ".github/workflows/tmp-tune.yml"
permissions:
  contents: read
  actions: read
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: web-agentcrawl
          path: cap
          run-id: 36286178996
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: web-*
          path: ref
          merge-multiple: true
          run-id: 36281772086
          github-token: ${{ github.token }}
      - run: python scripts/tmp_tune.py | tee -a "$GITHUB_STEP_SUMMARY"
