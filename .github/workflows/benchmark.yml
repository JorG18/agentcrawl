name: Benchmark

# Public comparison: snapshot the neutral corpus once, then score every
# extractor on the same bytes and on the offline fixtures. Runs on demand and
# on pull requests that touch the benchmark. Results, snapshots and every
# tool's Markdown are uploaded as artifacts; nothing is published automatically.
on:
  pull_request:
    paths:
      - "benchmarks/compare.py"
      - "benchmarks/snapshot.py"
      - "benchmarks/quality_report.py"
      - "benchmarks/corpus/neutral.json"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      tools:
        description: Comma-separated adapters (empty = all installed)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AgentCrawl and the compared extractors
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" html2text trafilatura crawl4ai
          # Crawl4AI renders through Playwright's Chromium.
          python -m playwright install --with-deps chromium
      - name: Snapshot the neutral corpus
        run: python -m benchmarks.snapshot
      - name: Offline fixtures lane
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          set -o pipefail
          python -m benchmarks.compare ${TOOLS:+--tools "$TOOLS"} \
            --json benchmark-fixtures.json | tee benchmark-fixtures.md
      # Every tool's output on every snapshot, reviewed or not, so the expected
      # signals can be written from what the page really says.
      - name: Dump outputs for review
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          python -m benchmarks.compare ${TOOLS:+--tools "$TOOLS"} \
            --corpus benchmarks/corpus/neutral.json --include-unreviewed \
            --dump-dir benchmark-outputs > /dev/null
      # Fails with "no scorable corpus pages" until each snapshot's expected
      # signals have been reviewed and written into neutral.json.
      - name: Neutral corpus lane
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          set -o pipefail
          python -m benchmarks.compare ${TOOLS:+--tools "$TOOLS"} \
            --corpus benchmarks/corpus/neutral.json \
            --json benchmark-corpus.json | tee benchmark-corpus.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark-*.json
            benchmark-*.md
            benchmarks/corpus/snapshots/index.json
      # Third-party content: kept as a short-lived artifact, never committed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-review
          retention-days: 7
          path: |
            benchmarks/corpus/snapshots/*.html
            benchmark-outputs/
